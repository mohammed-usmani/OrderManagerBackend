# Render infrastructure-as-code.
# See https://render.com/docs/blueprint-spec.
#
# Apply this blueprint from the Render dashboard (New → Blueprint) pointed at
# this repo. Secrets (API keys, DB URL, JWT, admin email/password) stay set
# `sync: false` so Render asks you to fill them once per environment — they
# never live in git.

services:
  - type: web
    name: saffron-smoke-api
    runtime: python
    plan: free
    rootDir: server
    # Build: install uv, sync deps, then run DB migrations so tables exist
    # before the app boots. Alembic reads DATABASE_URL from env — the
    # Render build environment has access to the service's env vars.
    buildCommand: |
      pip install uv
      uv sync --frozen
      uv run alembic upgrade head
    # Run via main.py so Python reads PORT from the environment directly —
    # avoids any shell-vs-exec `$PORT` expansion ambiguity with `uv run`.
    startCommand: uv run python main.py
    healthCheckPath: /health
    envVars:
      # Fill these in Render → Environment on first deploy.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: VOICE_ID
        sync: false
      # Semantic menu search (mistral-embed). Optional — falls back to keyword
      # search if unset. Defaults to "mistral-embed".
      - key: MISTRAL_EMBED_MODEL
        value: mistral-embed
      # Cloudinary image upload for menu photos. Optional — admins can paste an
      # image URL if unset. Format: cloudinary://<key>:<secret>@<cloud-name>
      - key: CLOUDINARY_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE_DAYS
        value: "7"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
